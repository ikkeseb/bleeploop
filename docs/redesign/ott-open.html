<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BleepLoop: the OTT open inside the main screen (MASKIN 2)</title>
<link rel="stylesheet" href="ott.css">
<style>
  /* Measured in the iframe (main.html at 1920x1080, getBoundingClientRect): re-measure when the main screen moves.
     The OTT plate in slot A: left edge and width. The plate row's top (92) and height (44) are the slot band's own. */
  :root {
    --plate-x: 565.7px;
    --plate-w: 175.2px;
    --pane-x: 320px;   /* the lane glass's bezel, left edge: the face hangs on this line */
  }
  .p-open { width: 1920px; height: 1080px; overflow: hidden; position: relative; }
  .p-open iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; display: block; }

  /* the open plate: one tone up, and a tie of the face's own panel from its foot down to the face */
  .p-open .lit { position: absolute; left: var(--plate-x); top: 92px; width: var(--plate-w); height: 44px; border-radius: 5px; pointer-events: none;
    background: linear-gradient(rgba(255,255,255,.1), rgba(255,255,255,.065)); box-shadow: inset 0 1px 0 rgba(255,255,255,.1); }
  .p-open .tie { position: absolute; left: calc(var(--plate-x) + var(--plate-w) / 2 - 16px); top: 140px; width: 32px; height: 16px; z-index: 2;
    background: linear-gradient(#1c1f24, #1d2025); border-radius: 3px 3px 0 0;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 1px 0 0 #07080a, -1px 0 0 #07080a, 0 -1px 0 #07080a, 0 -2px 3px rgba(0,0,0,.4); }
  .p-open .ott { left: var(--pane-x); top: 155px; z-index: 1;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.11), inset 0 -1px 0 rgba(0,0,0,.45), 0 0 0 1px #07080a,
      0 2px 2px rgba(0,0,0,.6), 0 10px 18px rgba(0,0,0,.45), 0 30px 60px rgba(0,0,0,.5); }
  .p-open .ott .close { display: flex; align-items: center; justify-content: center; right: 3px; top: 1px; width: 18px; height: 18px;
    border: 0; background: none; color: #9ba1a9; }
</style>
</head>
<body class="p-open">
<iframe src="main.html" title="BleepLoop main screen"></iframe>
<div class="lit"></div>
<div class="tie"></div>
<div class="ott" id="ott"></div>
<script src="ott.js"></script>
</body>
</html>
