[package]
name = "lf-rig"
version = "0.1.0"
description = "BleepLoop's rig record rules: chain mode's record, its projection and its restore, pure, tested off Windows"
license = "MIT"
repository = "https://github.com/ikkeseb/bleeploop"
edition = "2021"
rust-version = "1.85"
publish = false

# Pure on purpose: the rules only; every file, lock, thread and IPC call is the app's glue
# (the crate doc, src/lib.rs). lf-engine for the unit vocabulary (`UnitId`, `UnitKind`, `UnitParam`).
[dependencies]
lf-engine = { path = "../lf-engine" }
serde = { version = "1.0", features = ["derive"] }
# `float_roundtrip`: parse every number to the exact f64 the page wrote (D12); the default parser may
# land one ulp off (0.9999999999999999 → 1). Feature unification turns it on for the app's serde_json too.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
