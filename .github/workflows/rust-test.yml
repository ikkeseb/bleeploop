name: rust-test

# The workspace's Rust tests (the plugin hosts and scan, engine_io on its fake driver, the wire, native
# MIDI: no device, no ASIO SDK), lf-engine's on Windows among them (ci.yml's `engine` job runs those on
# Linux when a push touches native code).
# Separate from `ci` because it builds every test binary of the workspace (the cache holds dependencies
# only: ~6 min) and runs them, against ~2 min for `cargo check`. So it runs only when the Rust tree
# changes or a file its tests include from outside it (the wire fixtures in verify/fixtures/;
# verify/guards/ci-paths.mjs holds the paths below to every such include), plus on demand; a change to
# its markdown alone does not count, and it never delays a TS-only push. The binaries run side by side
# (scripts/cargo-test.mjs), as the local gate runs them: on the runner's four cores that took 5.5 and
# 10.5 min in two runs against ~14 one after another (on the dev PC's sixteen, 145 s against 443).

on:
  push:
    branches: [main]
    paths: ['src-tauri/**', '!src-tauri/**/*.md', 'verify/fixtures/**', '.cargo/**', 'rust-toolchain*', 'scripts/cargo-test.mjs', '.github/workflows/rust-test.yml']
  pull_request:
    branches: [main]
    paths: ['src-tauri/**', '!src-tauri/**/*.md', 'verify/fixtures/**', '.cargo/**', 'rust-toolchain*', 'scripts/cargo-test.mjs', '.github/workflows/rust-test.yml']
  workflow_dispatch: {}
  # build-exe.yml calls this for the exact commit it builds; the release waits for it.
  workflow_call: {}

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A push gets a group of its own (its run), so the next push never cancels its tests (ci.yml).
concurrency:
  group: rust-test-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No `--features asio` here — build-exe.yml owns the ASIO build (see ci.yml).
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: node scripts/cargo-test.mjs --workspace --no-default-features
