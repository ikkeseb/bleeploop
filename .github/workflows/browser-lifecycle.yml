name: browser-lifecycle

# Every browser probe in verify/probes/ except those whose header says `@no-ci` (verify/README.md).
# No audio hardware; the separately dispatched golden jam keeps its own policy.
on:
  push:
    branches: [main]
    paths: ['src/**', 'verify/**', 'package.json', 'pnpm-lock.yaml', 'vite.config.ts', '.github/workflows/browser-lifecycle.yml']
  pull_request:
    branches: [main]
    paths: ['src/**', 'verify/**', 'package.json', 'pnpm-lock.yaml', 'vite.config.ts', '.github/workflows/browser-lifecycle.yml']
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: browser-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Every probe without an `@no-ci` header line; `pnpm probe` starts and stops its own Vite and prints
      # a failing probe's full output.
      - run: pnpm probe --ci
