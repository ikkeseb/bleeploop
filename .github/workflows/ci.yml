name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # build-exe.yml calls this for the exact commit it builds; the release waits for it.
  workflow_call: {}

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# `github.workflow` is the CALLER's name under workflow_call, so a build-exe run never cancels, or
# deadlocks on, a plain push run of the same ref.
#
# A push gets a group of its own (its run), so the next push never cancels it: a docs-only push right
# after a code push used to cancel the code's run, and its own run skips the heavy jobs. A pull
# request still cancels its older runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'push' && github.run_id || '' }}
  cancel-in-progress: true

# The docs guard classifies the diff and always runs the deterministic verifiers. For a docs-only
# change it is the whole workflow; otherwise the JS/TS and Rust jobs run in parallel afterward, the
# two Rust jobs only when the diff touches what they read (`native`).
jobs:
  docs_guard:
    name: docs-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # no version input — pnpm/action-setup@v6 reads the packageManager pin in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      # scripts/ci-changes.mjs owns the fail-open diff and native path rules.
      - name: Classify changed paths
        id: changes
        env:
          CI_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CI_SHA: ${{ github.sha }}
          CI_REF_TYPE: ${{ github.ref_type }}
        run: node scripts/ci-changes.mjs

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  js:
    needs: docs_guard
    if: needs.docs_guard.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # no version input — pnpm/action-setup@v6 reads the packageManager pin in package.json,
      # so the version lives in ONE place (corepack-compatible).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # repo needs Node >=22.18 for verify/'s TS type stripping — Node 24 (current LTS) satisfies it.
      # setup-node@v6 limits automatic caching to npm, so the explicit `cache: pnpm` below is still
      # required — and pnpm/action-setup above must run first so the pnpm store path is resolvable.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs guard already ran the deterministic verifiers for this exact commit.
      - run: pnpm typecheck
      - run: pnpm lint

      # The vite bundle gate (the Tauri bundle input). `pnpm build` is `tsc --noEmit && vite build`,
      # but the typecheck half already ran via `pnpm typecheck` above — so run only `vite build` here to
      # avoid a second full tsc pass. (cargo check, in the parallel `rust` job, does not consume this
      # ../dist output — Tauri embeds it only on a release build.) The local `pnpm build` script keeps
      # both halves for a standalone one-shot gate.
      - run: pnpm exec vite build

  rust:
    needs: docs_guard
    if: needs.docs_guard.outputs.docs_only != 'true' && needs.docs_guard.outputs.native != 'false'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No `--features asio` here: the asio feature set is compiled by build-exe.yml (which fetches the
      # Steinberg SDK and owns the licence note) and heard only on the dev PC — see AGENTS.md.
      #
      # src-tauri/rust-toolchain.toml pins the toolchain to 1.96.0; rustup on the runner auto-installs it
      # on the first cargo invocation below, so no explicit toolchain-setup action is needed here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: cargo check --workspace
        working-directory: src-tauri

      # `cargo test` is NOT here: it builds the workspace's test binaries (the cache holds dependencies
      # only) and runs them, minutes against ~2 for this check — rust-test.yml, on src-tauri/ changes.

  # lf-engine, the pure engine crate (briefing: its src/lib.rs): its tests build nothing of the app, so
  # they run on Linux, on the same `native` diffs as `rust`. rust-test.yml runs them again on Windows.
  engine:
    needs: docs_guard
    if: needs.docs_guard.outputs.docs_only != 'true' && needs.docs_guard.outputs.native != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: node scripts/engine-deny.mjs
      # Plain cargo: side by side (scripts/cargo-test.mjs) the binaries took as long here, 7.5 min
      # against 5.4 to 7.4, since the long ones already fill the runner's four cores with their threads.
      - run: cargo test -p lf-engine
        working-directory: src-tauri
