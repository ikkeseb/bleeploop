name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# The docs guard classifies the diff and always runs the deterministic verifiers. For a docs-only
# change it is the whole workflow; otherwise the JS/TS and Rust jobs run in parallel afterward.
jobs:
  docs_guard:
    name: docs-guard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # Fails OPEN: an unusable base (first push, force-push, all-zero `event.before`) or a git error
      # yields an empty list, which classifies as NOT docs-only, so the heavy gates run. `--no-renames`
      # lists both sides of a move, so a file moved into `docs/` still counts as a source change.
      - name: Classify changed paths
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base='${{ github.event.pull_request.base.sha }}'
          else
            base='${{ github.event.before }}'
          fi
          files=''
          case "$base" in
            ''|0000000000000000000000000000000000000000) ;;
            *) if git cat-file -e "$base^{commit}" 2>/dev/null; then
                 files="$(git diff --no-renames --name-only "$base" '${{ github.sha }}' || true)"
               fi ;;
          esac
          docs_only=false
          if [ -n "$files" ]; then
            docs_only=true
            while IFS= read -r file; do
              case "$file" in
                *.md|*.MD|docs/*) ;;
                *) docs_only=false; break ;;
              esac
            done <<< "$files"
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          echo "base=$base docs_only=$docs_only"

      # no version input — pnpm/action-setup@v6 reads the packageManager pin in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  js:
    needs: docs_guard
    if: needs.docs_guard.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # no version input — pnpm/action-setup@v6 reads the packageManager pin in package.json,
      # so the version lives in ONE place (corepack-compatible).
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      # repo needs Node >=22.18 for verify/'s TS type stripping — Node 24 (current LTS) satisfies it.
      # setup-node@v6 limits automatic caching to npm, so the explicit `cache: pnpm` below is still
      # required — and pnpm/action-setup above must run first so the pnpm store path is resolvable.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The docs guard already ran the deterministic verifiers for this exact commit.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm check:boundary

      # The vite bundle gate (the Tauri bundle input). `pnpm build` is `tsc --noEmit && vite build`,
      # but the typecheck half already ran via `pnpm typecheck` above — so run only `vite build` here to
      # avoid a second full tsc pass. (cargo check, in the parallel `rust` job, does not consume this
      # ../dist output — Tauri embeds it only on a release build.) The local `pnpm build` script keeps
      # both halves for a standalone one-shot gate.
      - run: pnpm exec vite build

  rust:
    needs: docs_guard
    if: needs.docs_guard.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # No `--features asio` here: the asio feature set is compiled by build-exe.yml (which fetches the
      # Steinberg SDK and owns the licence note) and heard only on the dev PC — see AGENTS.md.
      #
      # src-tauri/rust-toolchain.toml pins the toolchain to 1.96.0; rustup on the runner auto-installs it
      # on the first cargo invocation below, so no explicit toolchain-setup action is needed here.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - run: cargo check
        working-directory: src-tauri

      - run: cargo check --no-default-features
        working-directory: src-tauri

      # `cargo test` is NOT here: it builds the full debug profile (~15 min on the Windows runner,
      # cached or not, vs ~2 min for the two checks) — it runs in rust-test.yml on src-tauri/ changes.
